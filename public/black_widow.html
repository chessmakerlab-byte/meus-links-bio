<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Instruções para os navegadores de celular não salvarem a página em cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Black Widow - Links</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px 20px; background-color: #f8fafc; color: #334155; }
        
        .header-container { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .logo-empresa { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 28px; color: #1e293b; }
        
        .links-container { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .botao-link { background: #ffffff; color: #0f172a; padding: 16px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: all 0.2s ease-in-out; }
        .botao-link:hover { background: #f1f5f9; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="logo_black_widow.png" alt="Logo Black Widow" class="logo-empresa" onerror="this.style.display='none'">
        <h1>Black Widow</h1>
    </div>
    
    <p>Acesse nossos principais canais:</p>
    <div class="links-container">
        <a href="https://open.spotify.com/track/2AMysGXOe0zzZJMtH3Nizb?si=8XxU7xkyR9KZAmmPNHml5w&utm_source=whatsapp" target="_blank" class="botao-link">Formidable</a>
        <a href="https://music.apple.com/br/album/i-am-invincible/1444608145?i=1444608152" target="_blank" class="botao-link">I Am Invincible - Single</a>
        <a href="https://music.apple.com/br/album/unstoppable/1055074478?i=1055074639" target="_blank" class="botao-link">This Is Acting</a>
        <a href="https://music.apple.com/br/album/f-kin-perfect/416562466?i=416562535" target="_blank" class="botao-link">F**kin' Perfect - Single</a>
    </div>
</body>
</html>
