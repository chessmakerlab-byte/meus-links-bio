<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smashbug - Central de Links</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #4f46e5; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-sizing: border-box; transition: 0.2s; }
        .btn:hover { background: #4338ca; }
        .btn-privado { background: #059669; }
        .btn-privado:hover { background: #047857; }
        #painel-login { margin-top: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="email"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smashbug & Capivara Xadrez</h1>
        <p>Tecnologia e Educação</p>
        
        <div id="lista-links"></div>

        <div id="painel-login">
            <h3>Área Restrita</h3>
            <p style="font-size: 14px; color: #666;">Digite seu e-mail autorizado para destravar os conteúdos exclusivos:</p>
            <input type="email" id="email-input" placeholder="seu.email@exemplo.com">
            <button class="btn" onclick="enviarMagicLink()">Receber Link Mágico</button>
            <p id="status-envio" style="font-size: 12px; color: #059669; margin-top: 10px;"></p>
        </div>
        
        <div id="painel-usuario" class="hidden">
            <p style="font-size: 14px; color: #059669; font-weight: bold;">Logado com sucesso!</p>
            <button class="btn" onclick="sair()" style="background: #dc2626;">Sair</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-en3tv1n6GAGXsVrkcSVL8kwykD-Sxhw",
            authDomain: "capivara-links.firebaseapp.com",
            projectId: "capivara-links",
            storageBucket: "capivara-links.appspot.com",
            messagingSenderId: "407462940289",
            appId: "1:407462940289:web:f378de6e4ca84806c0780",
            measurementId: "G-0WRYLWQQ5D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const mapaPermissoes = {'7deca56a40905cee433380dc24ffdf700d957f5cb212bbb8e79eaf3cd3035ec5': ['Equipe Smashug']};
        const todosLinks = [{'nome': 'Capivara Xadrez  Area restrita', 'url': 'https://docs.google.com/document/d/1YKrynT45FZjDFTwGNXlxzhFhKGMIPO2dYUHeR6jDmac/edit?usp=sharing', 'tags': ['Equipe CX']}, {'nome': 'Capivara Xadrez TikTok', 'url': '#', 'tags': ['Público']}, {'nome': 'Link', 'url': '#', 'tags': ['Público']}, {'nome': 'Playlist A saida É Para Dentro', 'url': 'https://open.spotify.com/show/7JemdbULjf1jYi1DY7oeCX', 'tags': ['Público']}, {'nome': 'Pinduca Alimentos', 'url': 'https://www.alimentospinduca.com.br/', 'tags': ['Público']}, {'nome': 'Pinduca Instagram', 'url': 'https://www.instagram.com/pinduca.sls', 'tags': ['Público']}, {'nome': 'Bem School', 'url': 'https://www.instagram.com/sandrosantana.bem', 'tags': ['Público']}, {'nome': 'Formidable', 'url': 'https://open.spotify.com/track/2AMysGXOe0zzZJMtH3Nizb?si=8XxU7xkyR9KZAmmPNHml5w&utm_source=whatsapp', 'tags': ['Público']}, {'nome': 'I Am Invincible - Single', 'url': 'https://music.apple.com/br/album/i-am-invincible/1444608145?i=1444608152', 'tags': ['Público']}, {'nome': 'This Is Acting', 'url': 'https://music.apple.com/br/album/unstoppable/1055074478?i=1055074639', 'tags': ['Público']}, {'nome': "F**kin' Perfect - Single", 'url': 'https://music.apple.com/br/album/f-kin-perfect/416562466?i=416562535', 'tags': ['Público']}, {'nome': 'Smashbug TikTok', 'url': 'https://www.tiktok.com/pt-BR/', 'tags': ['Público']}, {'nome': 'Smashbug Instagram', 'url': 'https://www.instagram.com/smashbugbrasil/', 'tags': ['Público']}, {'nome': 'Capivara Xadrez Instagram', 'url': 'https://www.instagram.com/capivaraxadrez/', 'tags': ['Público']}, {'nome': 'Capivara Conecta Instagram', 'url': 'https://www.instagram.com/capivaraxadrezconecta', 'tags': ['Público']}];

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message.trim().toLowerCase());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.enviarMagicLink = async function() {
            const email = document.getElementById('email-input').value;
            const status = document.getElementById('status-envio');
            
            if(!email) {
                alert('Por favor, digite um e-mail.');
                return;
            }

            const emailHash = await sha256(email);
            
            if (!mapaPermissoes[emailHash]) {
                alert('Este e-mail não possui acesso restrito cadastrado.');
                return;
            }

            const actionCodeSettings = {
                url: window.location.href.split('?')[0],
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                status.innerText = 'Link mágico enviado! Verifique sua caixa de entrada.';
            } catch (error) {
                console.error(error);
                status.style.color = '#dc2626';
                status.innerText = 'Erro ao enviar o link. Tente novamente.';
            }
        };

        window.sair = function() {
            signOut(auth).then(() => {
                window.location.href = window.location.href.split('?')[0];
            });
        };

        async function renderizarInterface(userTags) {
            const container = document.getElementById('lista-links');
            container.innerHTML = '';
            
            todosLinks.forEach(link => {
                let ehPublico = link.tags.includes('Público');
                let temPermissao = link.tags.some(tag => userTags.includes(tag));
                
                if (ehPublico || temPermissao) {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.className = ehPublico ? 'btn' : 'btn btn-privado';
                    a.innerText = link.nome;
                    if(link.url && link.url !== '#') {
                        a.target = '_blank';
                    }
                    container.appendChild(a);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await renderizarInterface([]);

            if (isSignInWithEmailLink(auth, window.location.href)) {
                let email = window.localStorage.getItem('emailForSignIn');
                if (!email) {
                    email = window.prompt('Por favor, confirme seu e-mail para concluir o login:');
                }
                try {
                    await signInWithEmailLink(auth, email, window.location.href);
                    window.localStorage.removeItem('emailForSignIn');
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (error) {
                    console.error(error);
                }
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    document.getElementById('painel-login').classList.add('hidden');
                    document.getElementById('painel-usuario').classList.remove('hidden');
                    
                    const emailHash = await sha256(user.email);
                    const userTags = mapaPermissoes[emailHash] || [];
                    
                    await renderizarInterface(userTags);
                }
            });
        });
    </script>
</body>
</html>
