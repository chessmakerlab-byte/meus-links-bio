<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capivara Xadrez - Links</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px 20px; background-color: #f8fafc; color: #334155; margin:0; }
        .header-container { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .logo-empresa { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 28px; color: #1e293b; }
        .links-container { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .botao-link { background: #ffffff; color: #0f172a; padding: 16px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.2s; display: block; }
        .botao-link:hover { background: #f1f5f9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="logo_capivara_xadrez.png" alt="Logo Capivara Xadrez" class="logo-empresa" onerror="this.style.display='none'">
        <h1>Capivara Xadrez</h1>
    </div>
    <p>Acesse nossos conteúdos:</p>
    <div class="links-container">
        <a href="#" onclick="solicitarAcesso('https://docs.google.com/document/d/1YKrynT45FZjDFTwGNXlxzhFhKGMIPO2dYUHeR6jDmac/edit?tab=t.0', 'danilowille@gmail.com,mandita.rr@gmail.com'); return false;" class="botao-link">🔒 CAPIVARA XADREZ </a>
        <a href="https://www.instagram.com/capivaraxadrez/" target="_blank" class="botao-link">🌐 Capivara Xadrez Instagram</a>
        <a href="https://www.instagram.com/capivaraxadrezconecta" target="_blank" class="botao-link">🌐 Capivara Conecta Instagram</a>
    </div>
    <script>
        let auth;
        try {
            const firebaseConfig = { apiKey: "AIzaSyDkNZcKi5euZbAXFFcvaQqrfpFVz7uYHVo", authDomain: "capivaraconecta.firebaseapp.com", projectId: "capivaraconecta", storageBucket: "capivaraconecta.firebasestorage.app", messagingSenderId: "1090195720709", appId: "1:1090195720709:web:9241e2523ab5ea56a52a6c" };
            firebase.initializeApp(firebaseConfig); auth = firebase.auth(); auth.languageCode = 'pt-BR'; auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
        } catch (erro) { console.error(erro); }

        window.addEventListener('load', function() {
            if (auth && auth.isSignInWithEmailLink(window.location.href)) {
                let email = window.localStorage.getItem('emailForSignIn');
                if (!email) email = window.prompt('Confirme o e-mail:');
                if (email) {
                    auth.signInWithEmailLink(email, window.location.href).then(() => {
                        window.localStorage.removeItem('emailForSignIn');
                        let targetUrl = new URLSearchParams(window.location.search).get('dest') || window.localStorage.getItem('targetUrl');
                        if (targetUrl) { window.localStorage.removeItem('targetUrl'); window.location.href = targetUrl; } else { alert("✅ Autenticado!"); window.history.replaceState(null, null, window.location.pathname); }
                    }).catch(() => alert("Link expirado."));
                }
            }
        });

        function solicitarAcesso(urlDestino, emailsPermitidos) {
            if (!auth) { alert("⚠️ Erro no sistema de segurança."); return; }
            let lista = emailsPermitidos.toLowerCase().split(',').map(e => e.trim());
            if (auth.currentUser) {
                if (lista.includes(auth.currentUser.email.toLowerCase())) { window.location.href = urlDestino; } else alert("⛔ E-mail sem permissão.");
                return;
            }
            let emailDigitado = prompt("Material restrito. Digite seu e-mail:");
            if (!emailDigitado) return;
            if (lista.includes(emailDigitado.toLowerCase())) {
                let urlComDestino = window.location.href.split('?')[0] + '?dest=' + encodeURIComponent(urlDestino);
                auth.sendSignInLinkToEmail(emailDigitado, { url: urlComDestino, handleCodeInApp: true }).then(() => {
                    window.localStorage.setItem('emailForSignIn', emailDigitado); window.localStorage.setItem('targetUrl', urlDestino); alert("✅ Link enviado para o e-mail.");
                });
            } else { alert("⛔ E-mail não localizado nas permissões."); }
        }
    </script>
</body>
</html>
