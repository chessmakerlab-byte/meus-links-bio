    <script>
        const firebaseConfig = { apiKey: "AIzaSyDkNZcKi5euZbAXFFcvaQqrfpFVz7uYHVo", authDomain: "capivaraconecta.firebaseapp.com", projectId: "capivaraconecta", storageBucket: "capivaraconecta.firebasestorage.app", messagingSenderId: "1090195720709", appId: "1:1090195720709:web:9241e2523ab5ea56a52a6c" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        function solicitarAcesso(url, emails) {
            const user = auth.currentUser;
            if (user && emails.includes(user.email.toLowerCase())) { window.location.href = url; return; }
            let email = prompt("Este conteúdo é restrito. Digite seu e-mail:");
            if (email && emails.includes(email.toLowerCase())) {
                auth.sendSignInLinkToEmail(email, { url: window.location.href, handleCodeInApp: true }).then(() => alert("✅ Link enviado!"));
            } else { alert("⛔ Acesso negado."); }
        }
    </script>
